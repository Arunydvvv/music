<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood & Music</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Montserrat & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Styles & Visual Effects */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0d0614;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Warm Sun Glare and Lens Flare Overlay Effect */
        .sun-glare {
            position: fixed;
            top: -120px;
            right: -120px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, 
                rgba(255, 235, 170, 0.95) 0%, 
                rgba(255, 170, 100, 0.6) 20%, 
                rgba(255, 100, 150, 0.25) 45%, 
                rgba(255, 100, 150, 0) 70%);
            border-radius: 50%;
            filter: blur(20px);
            pointer-events: none;
            z-index: 1;
            animation: sunPulse 8s infinite alternate ease-in-out;
        }

        /* Rotating Sun Light Rays */
        .sun-rays {
            position: fixed;
            top: -250px;
            right: -250px;
            width: 900px;
            height: 900px;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(255, 230, 180, 0.08) 15deg,
                transparent 30deg,
                rgba(255, 180, 200, 0.06) 45deg,
                transparent 60deg,
                rgba(255, 230, 180, 0.09) 90deg,
                transparent 120deg,
                rgba(255, 180, 200, 0.05) 150deg,
                transparent 180deg
            );
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: rayRotate 45s linear infinite;
        }

        /* Secondary Lens Flare Reflection Rings */
        .lens-flare-1 {
            position: fixed;
            top: 25%;
            right: 25%;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(255, 200, 220, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
            border: 1px solid rgba(255, 220, 230, 0.15);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(2px);
        }

        .lens-flare-2 {
            position: fixed;
            top: 45%;
            right: 42%;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(180, 230, 255, 0.25) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(1px);
        }

        @keyframes sunPulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.85; }
            50% { transform: scale(1.15) translate(-20px, 20px); opacity: 1; }
            100% { transform: scale(0.95) translate(10px, -10px); opacity: 0.85; }
        }

        @keyframes rayRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Dynamic Text Gradient Glow */
        .text-gradient-sun {
            background: linear-gradient(135deg, #ffb3c6 0%, #ff80bf 40%, #ffd166 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 179, 198, 0.4);
        }

        /* Interactive Pulsing CTA Button Effect */
        .cta-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 150, 180, 0.25), rgba(255, 210, 150, 0.25));
            border: 1px solid rgba(255, 180, 200, 0.6);
            box-shadow: 0 0 30px rgba(255, 150, 180, 0.35), inset 0 0 15px rgba(255, 220, 180, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            transition: left 0.7s ease;
        }

        .cta-btn:hover::before {
            left: 100%;
        }

        .cta-btn:hover {
            transform: translateY(-4px) scale(1.05);
            border-color: #ffb3c6;
            box-shadow: 0 0 45px rgba(255, 150, 180, 0.75), 0 0 20px rgba(255, 220, 150, 0.6), inset 0 0 20px rgba(255, 180, 200, 0.4);
        }

        .cta-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Ripple Effect Element */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="relative text-white min-h-screen overflow-x-hidden bg-cover bg-center bg-no-repeat bg-fixed flex flex-col justify-between items-center px-6 py-10" style="background-image: url('tm.png');">

    <!-- Sun Flare & Ray Visual Elements -->
    <div class="sun-glare"></div>
    <div class="sun-rays"></div>
    <div class="lens-flare-1"></div>
    <div class="lens-flare-2"></div>

    <!-- Top Navigation Bar -->
    <header class="w-full max-w-7xl flex justify-between items-center z-20">
        <div class="flex items-center gap-3">
            <span class="font-serif font-bold text-2
